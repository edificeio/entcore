<!-- list of documents -->
<article class="icons-view no-overflow no-margin-bottom ng-scope nextcloud-article"
         ng-if="isLoaded"
         ng-show="documents.length > 0">
    <explorer class="radius explorer-hover"
              ng-repeat="content in documents"
              ng-model="content.selected"
              ng-change="onSelectContent(content)"
              on-open="onOpenContent(content)"
              dragstart="draggable.dragStartHandler($originalEvent, content)"
              dragdrop="draggable.dragDropHandler($originalEvent, content)"
              dragend="draggable.dragEndHandler($originalEvent, content)"
              dropcondition="draggable.dropConditionHandler($originalEvent, content)">
        <div ng-class="{ selected: content.selected}">
            <div class="tile-menu-wrapper" ng-click="$event.stopPropagation()">
                <button type="button" class="tile-menu-toggle" ng-click="toggleTileMenu(content)" aria-label="Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2.2" fill="#4bafd5"/><circle cx="12" cy="12" r="2.2" fill="#4bafd5"/><circle cx="12" cy="19" r="2.2" fill="#4bafd5"/></svg>
                </button>
                <ul class="tile-menu" ng-class="{show: isTileMenuOpen(content)}">
                    <li ng-if="!isTrashMode()"><a ng-click="onTileOpen(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg><i18n>workspace.open</i18n></a></li>
                    <li ng-if="!isTrashMode() && content.editable"><a ng-click="onTileEdit(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><i18n>workspace.external.open</i18n></a></li>
                    <li ng-if="!isTrashMode()"><a ng-click="onTileDownload(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg><i18n>workspace.download</i18n></a></li>
                    <li ng-if="!isTrashMode()"><a ng-click="onTileRename(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg><i18n>workspace.properties</i18n></a></li>
                    <li ng-if="!isTrashMode()"><a ng-click="onTileMove(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><i18n>workspace.move</i18n></a></li>
                    <li ng-if="!isTrashMode()"><a ng-click="onTileCopy(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3"/><rect x="3" y="8" width="12" height="12" rx="2"/></svg><i18n>workspace.copy</i18n></a></li>
                    <li ng-if="!isTrashMode()"><a ng-click="onTileShare(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg><i18n>workspace.share</i18n></a></li>
                    <li ng-if="!isTrashMode()"><a ng-click="onTileDelete(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg><i18n>nextcloud.documents.trash</i18n></a></li>
                    <li ng-if="isTrashMode()"><a ng-click="onTileRestore(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg><i18n>workspace.trash.restore</i18n></a></li>
                    <li ng-if="isTrashMode()"><a ng-click="onTileDelete(content)"><svg class="tile-menu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg><i18n>workspace.delete</i18n></a></li>
                </ul>
            </div>
            <legend class="no-1d">
                <a>
                    <span tooltip-on-ellipsis="[[content.name]]">[[content.name]]</span>
                </a>
            </legend>

            <a class="container [[content.role]]" ng-switch="content.role">
                <!-- img format -->
                <div ng-switch-when="image" class="twelve cell">
                    <div class="clip">
                        <img ng-src="[[getFile(content)]]" alt="thumbnail" src="" width="117" height="115"/>
                    </div>
                </div>

                <div class="img video" ng-switch-when="video">
                    <i><svg class="icon-video" width="40" height="40"><use xlink:href="/workspace/public/img/illustrations.svg#icon-play"></use></svg></i>
                </div>
                <i ng-switch-when="presentation" class="ppt-large"></i>
                <i ng-switch-when="spreadsheet" class="xls-large"></i>
                <i ng-switch-default class="[[content.role]]-large"></i>
            </a>
        </div>

    </explorer>
</article>
