<div class="horizontal-spacing-twice">
    <h2 translate content="workspace.delete"></h2>
    <div class="row">
        <span translate content="confirm.remove"></span>
        <hr />
    </div>
    <div class="lightbox-buttons fluid">
        <!-- isDeleting: this lightbox stays open for the whole operation, so the header's own loader
             is never visible — show the spinner here instead, same fix as Google Drive/Nextcloud. -->
        <button class="right-magnet" ng-disabled="isDeleting" ng-click="confirm()">
            <i class="google-drive-import-spinner" ng-if="isDeleting" style="margin-right: 6px; vertical-align: middle;"></i>
            <i18n>workspace.delete.confirm.action</i18n>
        </button>
        <button class="cancel right-magnet" ng-disabled="isDeleting" ng-click="template.close('lightbox')"><i18n>cancel</i18n></button>
    </div>
</div>
