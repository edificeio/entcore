<div class="embedded-viewer height-minus200 height-minus270-1d" id="embeded-viewer" ng-style="contentAreaHeight ? {'height': contentAreaHeight + 'px'} : {}">
    <div class="controls__navbar flex-row align-center justify-between">
        <div class="flex-row align-center justify-between">
            <h2><i class="back" ng-click="closeViewFile()"></i></h2>
            <div class="flex-row f-column left-spacing-twice">
                <h2 class="no-margin">[[viewFile.name]]</h2>
                <small><span class="no-1d"><i18n>owner</i18n>:&nbsp;</span><strong>[[viewFile.ownerDisplayName]]</strong></small>
            </div>
        </div>
        <div class="flex-row align-center justify-between">
            <button class="cancel" ng-if="viewFile.editable" ng-click="openEditor(viewFile)"><i18n>workspace.external.open</i18n></button>
            <a class="cancel" ng-if="!viewFile.editable" ng-href="[[getFile(viewFile)]]" target="_blank"><i18n>download</i18n></a>
            <button
                class="drive-location-button"
                ng-click="openLocation(viewFile)"
                title="[[translate('google-drive.open.in.drive')]]"
                aria-label="[[translate('google-drive.open.in.drive')]]"
            >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 87.3 78" width="18" height="16" style="vertical-align: middle;">
                    <path fill="#0066da" d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z"/>
                    <path fill="#00ac47" d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z"/>
                    <path fill="#ea4335" d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.5l5.85 11.5z"/>
                    <path fill="#00832d" d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z"/>
                    <path fill="#2684fc" d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z"/>
                    <path fill="#ffba00" d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="file">
        <img ng-if="viewFile.role === 'image'" class="render" ng-src="[[getFile(viewFile)]]" />
        <audio ng-if="viewFile.role === 'audio'" controls class="render" ng-src="[[getFile(viewFile)]]"></audio>
        <video ng-if="viewFile.role === 'video'" controls class="render" ng-src="[[getFile(viewFile)]]"></video>
        <pdf-viewer ng-if="viewFile.role === 'pdf'" ng-src="[[getFile(viewFile)]]"></pdf-viewer>
        <div ng-if="viewFile.editable" class="default-viewer">
            <button ng-click="openEditor(viewFile)"><i18n>workspace.external.open</i18n></button>
        </div>
        <div ng-if="!viewFile.editable && viewFile.role !== 'image' && viewFile.role !== 'audio' && viewFile.role !== 'video' && viewFile.role !== 'pdf'" class="default-viewer">
            <a class="button" ng-href="[[getFile(viewFile)]]" target="_blank"><i18n>file.viewer.download</i18n></a>
        </div>
    </div>
</div>
