<!-- list of documents (list view) -->
<article class="list-view no-margin-bottom height-minus210-mobile-1d"
         ng-class="{'height-minus300 height-minus350-1d':infotipVisible,'height-minus200 height-minus270-1d':!infotipVisible}"
         ng-if="isLoaded"
         ng-show="documents.length > 0"
         >
    <p ng-if="!isLoaded" class="top-spacing-four flex-row align-start justify-center centered-text">
        <i18n>workspace.loading</i18n>&nbsp;<i class="loading"></i>
    </p>
    <table class="list-view sticky-header darkgrey primary-hover" ng-if="isLoaded">
        <thead>
        <tr id='start'>
            <th scope="col" class="icon">
                <input type="checkbox" ng-model="checkboxSelectAll" ng-change="onSelectAll()" id="gd-parent-checkbox"/>
            </th>
            <th scope="col" class="icon zero-mobile"></th>
            <th scope="col" class="content" ng-click="viewList.orderByField('name')">
                <span class="sortable">
                    <span class="icons right-spacing">
                        <i class="arrow" ng-class="{'icon-off':!viewList.isOrderedAsc('name')}"></i>
                        <i class="arrow bottom" ng-class="{'icon-off':!viewList.isOrderedDesc('name')}"></i>
                    </span>
                    <span translate content="name"></span>
                </span>
            </th>
            <th scope="col" class="last-modified zero-mobile" ng-click="viewList.orderByField('modifiedTime')">
                <span class="sortable">
                    <span class="icons right-spacing">
                        <i class="arrow" ng-class="{'icon-off':!viewList.isOrderedAsc('modifiedTime')}"></i>
                        <i class="arrow bottom" ng-class="{'icon-off':!viewList.isOrderedDesc('modifiedTime')}"></i>
                    </span>
                    <span translate content="modified"></span>
                </span>
            </th>
            <th scope="col" class="size zero-mobile" ng-click="viewList.orderByField('size')">
                <span class="sortable">
                    <span class="icons right-spacing">
                        <i class="arrow" ng-class="{'icon-off':!viewList.isOrderedAsc('size')}"></i>
                        <i class="arrow bottom" ng-class="{'icon-off':!viewList.isOrderedDesc('size')}"></i>
                    </span>
                    <span translate content="size"></span>
                </span>
            </th>
            <th scope="col" class="zero-mobile" ng-if="getGoogleDriveTreeController().isSharedViewOpen">
                <span translate content="google-drive.shared.owner"></span>
            </th>
            <th scope="col" class="zero-mobile" ng-if="getGoogleDriveTreeController().isSharedViewOpen">
                <span translate content="google-drive.shared.role"></span>
            </th>
        </tr>
        </thead>

        <tbody>
        <tr data-ng-repeat="document in documents"
            ng-class="{ overline: true, checked: document.selected }"
            draggable="true"
            dragend="draggable.dragEndHandler($originalEvent, document)"
            dragstart="draggable.dragStartHandler($originalEvent, document)">
            <td class="icon"><input type="checkbox" ng-model="document.selected" ng-change="onSelectContent(document)"/></td>
            <td class="icon zero-mobile" ng-switch="document.role">
                <div class="twelve cell">
                    <div class="img video" ng-switch-when="video">
                        <i><svg class="icon-video" width="16" height="16"><use xlink:href="/workspace/public/img/illustrations.svg#icon-play"></use></svg></i>
                    </div>
                    <i ng-switch-when="presentation" class="ppt"></i>
                    <i ng-switch-when="spreadsheet" class="xls"></i>
                    <i ng-switch-default class="[[document.role]]"></i>
                </div>
            </td>
            <td class="content">
                <a ng-click="onOpenContent(document)" ng-class="{ 'text-bold': document.isFolder }">
                    <svg
                        ng-if="document.isShared"
                        width="14" height="14" viewBox="0 0 24 24" fill="#4bafd5"
                        style="display: inline-block; vertical-align: middle; margin-right: 4px;"
                    >
                        <title>[[translate('google-drive.documents.shared.tooltip')]]</title>
                        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
                    </svg>
                    [[document.name]]
                </a>
            </td>
            <td class="date small-font zero-mobile">[[viewList.displayLastModified(document)]]</td>
            <td class="size small-font zero-mobile">[[formatDocumentSize(document.size)]]</td>
            <td class="small-font zero-mobile" ng-if="getGoogleDriveTreeController().isSharedViewOpen">[[document.ownerDisplayName]]</td>
            <td class="small-font zero-mobile" ng-if="getGoogleDriveTreeController().isSharedViewOpen">
                [[translate('google-drive.role.' + document.permissionRole)]]
            </td>
        </tr>
        </tbody>
    </table>
</article>
