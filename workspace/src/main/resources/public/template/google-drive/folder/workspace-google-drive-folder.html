<div class="google-drive">
    <!-- Google Drive folder tree -->
    <folder-tree
        id="google-drive-folder-tree"
        tree-props="folderTree"
        dragdrop="droppable.dragDropHandler($originalEvent)"
    >
    </folder-tree>

    <!-- Google Drive navigation contents -->
    <!-- Triggers moved to the page header; these popups stay here since that's what the header buttons actually open. -->
    <div class="google-drive-content bottom-spacing-three">
        <div id="google-drive-folder-create" ng-show="selectedFolder">
            <div
                ng-include="'/workspace/public/template/google-drive/folder/folder-creation.html'"
            ></div>
            <div
                ng-include="'/workspace/public/template/google-drive/folder/empty-trash.html'"
            ></div>
        </div>
    </div>
    <!-- Mobile-only copy of the desktop quota footer: below 800px the sidebar is a full-screen drawer, so a pinned footer won't fit. -->
    <!-- This template stays mounted even when Google Drive isn't active, so driveQuota alone isn't enough — hence the $root.isGDTrashbinOpen guard. -->
    <div class="google-drive-quota-footer-mobile" ng-if="driveQuota && $root.isGDTrashbinOpen">
        <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.35); overflow: hidden;">
            <div ng-if="!driveQuota.unlimited" style="height: 100%; border-radius: 3px; background: #fff;" ng-style="{'width': driveQuota.usedRatio + '%'}"></div>
            <div ng-if="driveQuota.unlimited" style="height: 100%; width: 100%; border-radius: 3px; background: #fff;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: #fff;">
            <span style="display: inline-flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 87.3 78" width="16" height="14" style="margin-right: 6px; vertical-align: middle; flex-shrink: 0;">
                    <path fill="#0066da" d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z"/>
                    <path fill="#00ac47" d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z"/>
                    <path fill="#ea4335" d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.5l5.85 11.5z"/>
                    <path fill="#00832d" d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z"/>
                    <path fill="#2684fc" d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z"/>
                    <path fill="#ffba00" d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z"/>
                </svg>
                <i18n>google-drive.quota</i18n>
            </span>
            <span ng-if="!driveQuota.unlimited">[[driveQuota.usedDisplay]] / [[driveQuota.total]] [[driveQuota.unit]]</span>
            <span ng-if="driveQuota.unlimited"><i18n>google-drive.unlimited.space</i18n></span>
        </div>
    </div>
</div>
