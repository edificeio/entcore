services:
  maven:
    image: opendigitaleducation/mvn-java8-node20:latest
    user: "$DEFAULT_DOCKER_USER"
    working_dir: /usr/src/maven
    volumes:
      - ./:/usr/src/maven
      - ~/.m2:/var/maven/.m2
    environment:
      MAVEN_CONFIG: /var/maven/.m2

  # Builds every frontend (pnpm workspace: AngularJS, React, admin).
  node:
    image: opendigitaleducation/node:24-alpine-pnpm
    working_dir: /home/node/app
    volumes:
      - ./:/home/node/app
      # pnpm store, kept outside the workspace: the Jenkins checkout cleans the
      # workspace (git clean -ffdx). PNPM_STORE_DIR overrides the location.
      - ${PNPM_STORE_DIR:-~/.pnpm-store}:/home/node/.pnpm-store
      - ../recette:/home/node/recette # TODO : rendre générique pour appliquer à tous les springboards
    environment:
      - npm_config_store_dir=/home/node/.pnpm-store
      - NG_CLI_ANALYTICS=false

  k6:
    image: grafana/k6:master
    volumes:
      - ./tests/src/test/js:/home/k6/src
      - ./tests/src/test/resources/data:/home/k6/data
    environment:
      ROOT_URL: http://172.17.0.1:8090
      DATA_ROOT_PATH: /home/k6/data
      DURATION: 61s
      VUS: 100
      ADMC_LOGIN: tom.mate
      ADMC_PASSWORD: password
      DEFAULT_PASSWORD: password
      RECREATE_STRUCTURES: false # Set to 'true' if you want to run the tests on brand new structures
