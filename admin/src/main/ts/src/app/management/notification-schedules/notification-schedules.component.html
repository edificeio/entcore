<div>
  <div class="cell flashmsg blue">
    <svg class="icon-svg flash-icon" width="20" height="20" viewBox="0 0 24 24">
      <use href="/admin/public/icons/icons.svg#info-circle"></use>
    </svg>
    <div class="flash-content">
      <b>
        <s5l>management.structure.notification.schedules.info.title</s5l>
      </b>
      <p><s5l>management.structure.notification.schedules.info.text</s5l></p>
    </div>
  </div>

  <div class="container has-shadow">
    <form #tzForm="ngForm" (ngSubmit)="showConfirmLightbox = true" class="has-vertical-padding-10">
      <b>
        <label
          ><s5l>management.structure.notification.schedules.title</s5l>
          <input
            type="checkbox"
            name="enableCB"
            [(ngModel)]="enabled"
            class="is-pulled-right"
          />
        </label>
      </b>

      <p>
        <s5l>management.structure.notification.schedules.paragraph</s5l>
      </p>

      <ode-form-field
        label="management.structure.notification.schedules.timezone"
      >
        <input
          type="hidden"
          name="timezone"
          [(ngModel)]="timezone.value"
          (click)="showTimezones = true"
        />

        <button
          type="button"
          class="button is-primary"
          [disabled]="spinner.isLoading('portal-content')"
          (click)="showTimezones = true"
        >
          {{ timezone.label }}
        </button>

        <ode-lightbox [show]="showTimezones" (onClose)="showTimezones = false">
          <h2>
            <s5l
              >management.structure.notification.schedules.timezone.choose</s5l
            >
          </h2>
          <ode-list
            [model]="timezones"
            sort="label"
            [isSelected]="isSelected"
            [inputFilter]="filterByInput"
            searchPlaceholder="search"
            noResultsLabel="management.structure.notification.schedules.timezone.no.results"
            (inputChange)="timezoneInputFilter = $event"
            (onSelect)="onTimezoneSelect($event)"
          >
            <ng-template let-item>
              <div>{{ item.label }}</div>
            </ng-template>
          </ode-list>
        </ode-lightbox>
      </ode-form-field>

      <button
        type="submit"
        class="is-pulled-right"
        [disabled]="tzForm.pristine || tzForm.invalid || !timezone"
      >
        <s5l>management.structure.notification.schedules.save</s5l>
      </button>
    </form>
  </div>

  <ode-lightbox-confirm
    lightboxTitle="management.structure.notification.schedules.confirm.title"
    [show]="showConfirmLightbox"
    (onCancel)="showConfirmLightbox = false"
    (onConfirm)="save(); showConfirmLightbox = false"
  >
    <p>
      <b>{{ confirmTitle | translate }}</b>
    </p>
  </ode-lightbox-confirm>
</div>
