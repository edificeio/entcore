<!doctype html>
<!--
  No lang attribute on purpose: the displayed language depends on the
  translations served by the backend (managed in Phrase), so browsers must
  detect it from the content. A hard-coded value makes Chrome offer a wrong
  automatic translation that garbles the labels.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{#i18n}}auth.title{{/i18n}}</title>
    <meta
      name="description"
      content="{{#i18n}}wayf.meta.description{{/i18n}}"
    />
    <link rel="icon" id="favicon" href="" />
    <script type="text/json" id="saml-wayf">
      {
        "childTheme": "{{childTheme}}",
        "mobile": "{{mobile}}"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="portal"></div>
    <div id="beta-switch"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
